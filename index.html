<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mellcita</title>

<style>

/* BLOQUEAR SCROLL COMPLETAMENTE */

html,body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
touch-action:none;
}

@media (min-width:768px){
body{
display:flex;
justify-content:center;
align-items:center;
font-family:sans-serif;
}
body::before{
content:"📱 Ábrelo desde tu celular";
font-size:22px;
}
.app{display:none;}
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff4fa3,#7a4dff);
display:flex;
justify-content:center;
align-items:center;
color:white;
position:fixed;
width:100%;
height:100%;
}

.app{
width:100%;
max-width:420px;
padding:30px;
text-align:center;
}

.card{
background:white;
color:#444;
border-radius:20px;
padding:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
animation:fade .6s;
}

h2{margin-top:0;}

button{
margin-top:20px;
padding:14px 20px;
border:none;
border-radius:30px;
background:#ff4fa3;
color:white;
font-size:16px;
cursor:pointer;
width:100%;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.option{
background:#7a4dff;
margin-top:10px;
}

.foto-container{
position:relative;
margin-top:20px;
}

.foto{
width:100%;
border-radius:18px;
box-shadow:
0 20px 40px rgba(0,0,0,0.4),
0 0 35px rgba(255,80,180,0.5);
animation:zoomFoto 6s ease-in-out infinite;
}

@keyframes zoomFoto{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}

/* CORAZONES */

.heart{
position:fixed;
animation:float 6s linear forwards;
}

@keyframes float{
0%{transform:translateY(0) scale(.5);opacity:1;}
100%{transform:translateY(-100vh) scale(1.5);opacity:0;}
}

/* EXPLOSIONES */

.explosion{
position:fixed;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
0%{transform:scale(.5);opacity:1;}
100%{transform:scale(2) translateY(-100px);opacity:0;}
}

/* ROSAS */

.rose{
position:fixed;
animation:roseFall linear forwards;
pointer-events:none;
}

@keyframes roseFall{
0%{transform:translateY(-10vh) rotate(0deg);}
100%{transform:translateY(110vh) rotate(360deg);}
}

/* PANTALLA VIRUS */

.virus{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:99999;
font-family:monospace;
}

.virus h1{
color:red;
font-size:40px;
animation:blink .6s infinite;
}

.virus p{
color:white;
font-size:20px;
margin-top:20px;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:.2;}
100%{opacity:1;}
}

</style>
</head>

<body>

<div class="app">

<div class="card" id="pantalla">

<h2>Hola 🙂</h2>
<p>Quería preguntarte algo...</p>

<button onclick="siguiente(1)">Continuar</button>

</div>

</div>

<script>

const pantalla=document.getElementById("pantalla")

function siguiente(paso){

if(paso===1){

pantalla.innerHTML=`
<h2>Hoy es un día especial 🌸</h2>
<p>¿Sabes qué día es hoy?</p>

<button class="option" onclick="siguiente(2)">Sí lo sé</button>
<button class="option" onclick="siguiente(3)">No estoy segura</button>
`
}

if(paso===2){

pantalla.innerHTML=`
<h2>Entonces lo sabes 💜</h2>

<p>Hoy celebramos a todas las mujeres increíbles. Y no te quedas atrás, te quiero, FELIZ DÍA.</p>

<button onclick="siguiente(4)">Continuar</button>
`
}

if(paso===3){

pantalla.innerHTML=`
<h2>Hoy es 8 de marzo 🌸</h2>

<p>El Día de la Mujer, en especial para ti mi duende favorito :3.</p>

<button onclick="siguiente(4)">Continuar</button>
`
}

if(paso===4){

pantalla.innerHTML=`
<h2>Y quería decirte algo...</h2>

<p>Hay duendecillos que hacen el mundo más bonito.</p>

<button onclick="siguiente(5)">Seguir</button>
`
}

if(paso===5){

pantalla.innerHTML=`
<h2>✨ Tú eres una de ellas ✨</h2>

<p>Eres fuerte, valiosa, carismática, loca, muy LOCA, hermosa y muy especial duendecillo.</p>

<button onclick="siguiente(6)">Abrir carta 💌</button>
`
}

if(paso===6){

pantalla.innerHTML=`
<h2>💌 Carta para ti</h2>

<p>
En este día quiero recordarte algo:
que eres la mujer más hermosa y maravillosa que he conocido,
gracias Mell Garcia, más conocida como la chata mata hormigas.
</p>

<div class="foto-container">
<img src="foto.jpeg" class="foto">
</div>

<button onclick="celebrar()">Celebrar 🎉</button>
`
}

}

/* CELEBRAR */

function celebrar(){

for(let i=0;i<40;i++){

const h=document.createElement("div")
h.className="heart"
h.innerHTML="💜"

h.style.left=Math.random()*100+"vw"
h.style.bottom="0"
h.style.fontSize=(20+Math.random()*30)+"px"

document.body.appendChild(h)

setTimeout(()=>h.remove(),6000)

}

/* VIRUS BROMA */

setTimeout(mostrarVirus,6000)

}

/* VIRUS */

function mostrarVirus(){

document.body.innerHTML=`

<div class="virus">

<h1>⚠ ADVERTENCIA ⚠</h1>

<p>SISTEMA INFECTADO</p>

<p>Detectando virus...</p>

<p style="color:red;">El dispositivo será bloqueado</p>

<p style="margin-top:40px;color:white;">
💀 Solo es una broma 😆
</p>

</div>

`

}

/* ROSAS */

function crearRosa(){

const r=document.createElement("div")

r.className="rose"
r.innerHTML="🌹"

r.style.left=Math.random()*100+"vw"
r.style.fontSize=(20+Math.random()*30)+"px"
r.style.animationDuration=(4+Math.random()*3)+"s"

document.body.appendChild(r)

setTimeout(()=>r.remove(),7000)

}

setInterval(crearRosa,700)

</script>

</body>
</html>
